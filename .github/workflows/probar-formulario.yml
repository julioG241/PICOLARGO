name: Probar formulario (3 envíos)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm init -y >/dev/null
          npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > test.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            let ok = 0;
            for (let i = 1; i <= 3; i++) {
              const p = await b.newPage();
              p.on('response', async r => { if (r.url().includes('web3forms')) console.log(`  envío ${i}: HTTP ${r.status()} ${(await r.text().catch(()=>'')).slice(0,200)}`); });
              await p.goto('https://juliog241.github.io/PICOLARGO/?t=' + Date.now(), { waitUntil: 'networkidle' });
              await p.fill('#f-name', `Prueba ${i} (automática)`);
              await p.fill('#f-company', 'Prueba del sitio web');
              await p.fill('#f-email', 'juliojjosegonzalez@gmail.com');
              await p.fill('#f-phone', '6350000000');
              await p.selectOption('#f-product', { index: i });
              await p.fill('#f-msg', `Mensaje de prueba número ${i} del formulario de Pico Largo.`);
              await p.click('#submit');
              await p.waitForFunction(() => /Gracias|No se pudo|Revisa/.test(document.querySelector('#status')?.textContent || '') || location.hostname !== 'juliog241.github.io', null, { timeout: 30000 }).catch(() => {});
              const st = await p.textContent('#status').catch(() => '(página cambió: ' + p.url() + ')');
              console.log(`Envío ${i}: ${st}`);
              if (/Gracias/.test(st)) ok++;
              await p.close();
              await new Promise(r => setTimeout(r, 4000));
            }
            await b.close();
            console.log(`RESULTADO: ${ok}/3 enviados correctamente`);
            process.exit(ok === 3 ? 0 : 1);
          })();
          JS
          node test.js
